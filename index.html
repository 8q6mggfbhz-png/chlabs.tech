<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortez Hudson | Systems & Infrastructure</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.4rem; color: #f0f6fc; }
        .btn {
            background-color: #238636;
            color: #ffffff;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn:hover { background-color: #2ea043; }
        .viewer-container {
            width: 100%;
            max-width: 960px;
            height: 85vh;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            background-color: #161b22;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Cortez Hudson</h1>
            <p style="font-size: 0.85rem; color: #8b949e;">Data Center & Systems Infrastructure</p>
        </div>
        <a href="CortezHudson.pdf" download class="btn">Download PDF</a>
    </header>

    <div class="viewer-container">
        <iframe src="CortezHudson.pdf">
            <p>Your browser doesn't support PDF viewing. <a href="CortezHudson.pdf">Download it here</a>.</p>
        </iframe>
    </div>
</body>
</html>
